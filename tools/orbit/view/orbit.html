<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit</title>
    <style>
      @font-face {
        font-family: 'Geist Mono';
        src: url('https://cdn.jsdelivr.net/npm/geist@1.9.2/dist/fonts/geist-mono/GeistMono-Variable.woff2')
          format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        color-scheme: light dark;
        --surface: light-dark(oklch(100% 0 0), oklch(17.5% 0 0));
        --subtle: light-dark(oklch(93% 0 0), oklch(24.5% 0 0));
        --foreground: light-dark(
          oklch(22.7% 0.006 271.2),
          oklch(92.3% 0.004 286.3)
        );
        --muted: light-dark(oklch(52% 0.044 267.6), oklch(67.3% 0.028 276.2));
        --hazard: light-dark(oklch(46% 0.191 32.2), oklch(71.2% 0.191 32.2));
        --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        margin: 0;
        padding: 1px;
        background: transparent;
      }
      main {
        position: relative;
        height: 260px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--subtle);
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      main:focus-visible {
        outline: 2px solid var(--muted);
        outline-offset: 2px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        margin: 0;
        font: 500 12px/16px var(--mono);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #score {
        top: 12px;
        left: 14px;
        color: var(--foreground);
      }
      #best {
        top: 12px;
        right: 14px;
      }
      #hint {
        bottom: 12px;
        left: 0;
        right: 0;
        text-align: center;
      }
      /* Read for the canvas, so it draws in the theme's colours. */
      .probe {
        display: none;
      }
    </style>
  </head>
  <body>
    <main tabindex="0" aria-label="Orbit. Press space or tap to switch rings.">
      <canvas></canvas>
      <p id="score">0</p>
      <p id="best"></p>
      <p id="hint">Tap or press space to start</p>
    </main>
    <i class="probe" style="color: var(--foreground)"></i>
    <i class="probe" style="color: var(--muted)"></i>
    <i class="probe" style="color: var(--subtle)"></i>
    <i class="probe" style="color: var(--hazard)"></i>
    <script type="module" src="./orbit.ts"></script>
  </body>
</html>
