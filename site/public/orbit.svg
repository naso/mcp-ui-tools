<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ground { fill: #a2a4ab }
    .surface { fill: #fff }
    .subtle { fill: #ececec }
    .line-surface { fill: none; stroke: #fff }
    .line-subtle { fill: none; stroke: #ececec }
    .cut { stroke: #a2a4ab }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #5c5d63 }
      .surface { fill: #121212 }
      .subtle { fill: #2a2a2a }
      .line-surface { stroke: #121212 }
      .line-subtle { stroke: #2a2a2a }
      .cut { stroke: #5c5d63 }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="8" />
  <circle class="line-surface" cx="16" cy="16" r="11" stroke-width="2" />
  <circle class="line-subtle" cx="16" cy="16" r="5.5" stroke-width="2" />
  <circle class="surface cut" cx="23.78" cy="8.22" r="3.4" stroke-width="1.6" />
</svg>
